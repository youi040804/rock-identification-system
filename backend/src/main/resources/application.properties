# =========================
# Application
# =========================
spring.application.name=rockbackend
server.port=8081


# =========================
# Database
# Sensitive values are provided through environment variables.
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/didarock}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# =========================
# MyBatis
# Do not use StdOutImpl in normal runtime because it prints SQL parameters.
# =========================
mybatis.configuration.map-underscore-to-camel-case=true


# =========================
# Multipart Upload
# =========================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


# =========================
# Rock Recognition Inference Service
# =========================
app.inference.url=${INFERENCE_URL:http://127.0.0.1:8000/predict}


# =========================
# File Storage
# Can be overridden by environment variables.
# =========================
app.image.upload-path=${ROCK_UPLOAD_PATH:src/main/resources/static/cnnpythonproject/upload/}

user.avatar.path=${USER_AVATAR_PATH:useravatar/}
user.avatar.db.prefix=/userAvatar/

feedback.image.path=${FEEDBACK_IMAGE_PATH:src/main/feedback_image/}
feedback.db.prefix=/feedback_image/

training.image.path=${TRAINING_IMAGE_PATH:src/main/temp_training_set/}
training.db.prefix=/temp_training_set/

train.image.path=${TRAIN_IMAGE_PATH:src/main/temp_training_set/}
train.db.prefix=train_


# =========================
# Mail / QQ SMTP
# Credentials must not be committed to source control.
# =========================
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000